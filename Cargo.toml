[package]
name = "cigi_trillium"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust — set by icu_*'s MSRV (see commit 77aaee7).
# Production builds use rust:1.95-bookworm (latest stable) per the Dockerfile.
rust-version = "1.90"

[dependencies]
tokio = { version = "1", features = ["full"] }
# sim-core lives in the sibling sim-environment/ git repo, which the
# parent directory keeps as a peer of this crate. The path traversal
# `../sim-environment/sim-core` is stable because both repos are
# checked out under /opt/mac/sim-environment/ by convention.
sim-core = { path = "../sim-environment/sim-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
roxmltree = "0.20"
