# CIGI Trillium Gimbal Simulator — HD45-LV-CZ-GS Configuration
#
# Trillium HD45-LV-CZ-GS specs:
#   Pan:   360° continuous (no hard stop)
#   Tilt:  -80° to +42°
#   EO:    46.8° – 1.2° HFOV (40× zoom)
#   LWIR:  29° – 3° HFOV (10× zoom)
#   Power: 24 VDC, 15 W avg / 75 W peak
#
# Usage: rename to config.toml, or extend main.rs to accept --config <path>.
#
# NOTE: pan_limit_deg = 360 disables the hard-stop clamp (continuous rotation).
# The simulator treats any value >= 360 as unlimited pan.

[network]
port = 8008

[kinematics]
# Slew rate unspecified in HD45 datasheet — placeholder, tune to measured hardware.
max_slew_rate_deg_s = 60.0
max_accel_deg_s2    = 300.0
# 360 = continuous rotation (no hard stop)
pan_limit_deg       = 360.0
tilt_min_deg        = -80.0
tilt_max_deg        = 42.0

[camera]
# Per-camera FOV (wide = zoom 0, narrow = zoom 1).
# Camera 0: EO (46.8° – 1.2° HFOV, 40× zoom)
camera_0_hfov_wide_deg   = 46.8
camera_0_vfov_wide_deg   = 35.1
camera_0_hfov_narrow_deg = 1.2
camera_0_vfov_narrow_deg = 0.9

# Camera 1: EO narrow (same sensor, fixed narrow preset)
camera_1_hfov_wide_deg   = 5.0
camera_1_vfov_wide_deg   = 3.75
camera_1_hfov_narrow_deg = 1.2
camera_1_vfov_narrow_deg = 0.9

# Camera 2: LWIR (29° – 3° HFOV, 10× zoom)
camera_2_hfov_wide_deg   = 29.0
camera_2_vfov_wide_deg   = 21.75
camera_2_hfov_narrow_deg = 3.0
camera_2_vfov_narrow_deg = 2.25

[vibration]
# HD45 spec: 1.5° typical total system accuracy — model as moderate jitter.
jitter_freq_hz       = 10.0
jitter_amplitude_deg = 0.1
noise_floor_deg      = 0.05
