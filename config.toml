hfov_wide_deg   = 30.0
vfov_wide_deg   = 22.5
hfov_narrow_deg = 3.0
vfov_narrow_deg = 2.25

[vibration]
jitter_freq_hz      = 10.0
jitter_amplitude_deg = 0.05
noise_floor_deg     = 0.01
