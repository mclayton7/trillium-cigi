# CIGI Trillium Bridge — Runtime Configuration
# All angles in degrees; rates in deg/s or deg/s²; altitudes in metres.
# Lines starting with '#' or '[section]' headers are ignored.

[network]
orion_listen_port = 8008
scene_generator_ip = "127.0.0.1"
scene_generator_cigi_port = 8888
cigi_listen_port = 8889

[platform]
platform_lat_deg   = 0.0
platform_lon_deg   = 0.0
platform_alt_m     = 0.0
platform_roll_deg  = 0.0
platform_pitch_deg = 0.0
platform_yaw_deg   = 0.0

[kinematics]
max_slew_rate_deg_s = 60.0
max_accel_deg_s2    = 300.0
pan_limit_deg       = 170.0
tilt_min_deg        = -110.0
tilt_max_deg        = 30.0

[camera]
# Wide (zoom=0) and narrow (zoom=1) field of view.
hfov_wide_deg   = 30.0
vfov_wide_deg   = 22.5
hfov_narrow_deg = 3.0
vfov_narrow_deg = 2.25

[vibration]
jitter_freq_hz      = 10.0
jitter_amplitude_deg = 0.05
noise_floor_deg     = 0.01

[gimbal_mount]
# Physical installation of the gimbal on the airframe.
# Translation: offset from airframe CG to gimbal base, body frame (fwd/right/down), metres.
# Rotation: fixed boresight rotation of gimbal base relative to body frame (roll/pitch/yaw), degrees.
# Default (all zeros): gimbal at CG, boresight along airframe nose.
gimbal_mount_fwd_m    = 0.0
gimbal_mount_right_m  = 0.0
gimbal_mount_down_m   = 0.0
gimbal_mount_roll_deg  = 0.0
gimbal_mount_pitch_deg = 0.0
gimbal_mount_yaw_deg   = 0.0

[platform_source]
# "static" (default): use config values above, never updated.
# "mavlink": receive real-time position/attitude from a MAVLink autopilot over UDP.
platform_source      = "mavlink"
mavlink_listen_port  = 14550
mavlink_system_id    = 0
stanag_listen_port   = 4586
stanag_multicast_group = "239.0.0.1"
stanag_vehicle_id    = 0
