# CIGI Trillium Bridge — Runtime Configuration
#
# Minimal config. Only the network ports are set here so the bridge
# talks to the correct CIGI scene-generator sockets. Every other
# section (platform_source, kinematics, camera, vibration, stabilization,
# gimbal_mount, atmosphere, terrain, geopoint, track) uses
# Config::default() — see src/config.rs for the default values.
#
# The previous config.toml had many fields that are no longer accepted
# by the current schema ([platform], [camera] with flat fovs, etc.) —
# those sections were either renamed, restructured, or are now part of
# Config::default(). Rather than hand-port every field, this file only
# sets what we actually need to override, and lets the Rust defaults
# fill in the rest.

[network]
orion_listen_port = 8747
scene_generator_ip = "127.0.0.1"
scene_generator_cigi_port = 8888
cigi_listen_port = 8889

# Runtime mode — defaults to "bridge" (talk to CIGI scene generator).
# Uncomment to run as a standalone gimbal/Trillium telemetry source with no
# CIGI side at all (no UDP bind, no scene-generator polling). The CLI flags
# `--simulator` and `--bridge` override this value.
# [runtime]
# mode = "simulator"
